name: CI y compilación SdA Creator

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ── Verificación: lint + tipos + tests (rápido, en Linux) ──────────────
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Comprobación de tipos
        run: npm run typecheck

      - name: Tests y cobertura (con umbrales)
        run: npm run test:coverage

  # ── Compilación del instalador de Windows (solo si la verificación pasa) ─────
  # Solo Windows: la distribución es .exe. Para añadir macOS hace falta una cuenta
  # de Apple Developer (firma/notarización); ver docs/RELEASE-Y-FIRMA.md.
  build:
    needs: verificar
    runs-on: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Publica en GitHub Releases solo cuando se compila desde una etiqueta (vX.Y.Z);
      # en push/PR normales solo genera el instalador como artefacto.
      - name: Compilar para Windows
        run: npm run dist:win -- --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de código (rellenar como secretos del repo para activar la firma):
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: SdA-Creator-Windows
          path: dist/*.exe
